<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简约 · 中国风</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f5f0e6;color:#2c2c2c;font-family:'KaiTi','STKaiti',serif;background-image:url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"100\" height=\"100\"><rect width=\"100\" height=\"100\" fill=\"%23f5f0e6\"/><path d=\"M50 10 L90 40 L90 90 L50 80 L10 90 L10 40 Z\" fill=\"%238b3a3a\" opacity=\"0.1\"/><path d=\"M50 20 L70 40 L70 70 L50 60 L30 70 L30 40 Z\" fill=\"%23c9a66b\" opacity=\"0.15\"/></svg>');background-repeat:repeat;background-size:100px 100px}
  .container{max-width:800px;margin:0 auto;padding:40px 20px}
  header{text-align:center;margin-bottom:40px}
  h1{font-size:3rem;color:#8b3a3a;margin-bottom:10px;font-weight:300;letter-spacing:8px}
  .subtitle{font-size:1.2rem;color:#c9a66b;margin-bottom:30px}
  .content{background:rgba(255,255,255,0.8);border:1px solid #d6cfc7;border-radius:12px;padding:40px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
  .poem{margin:30px 0;text-align:center;line-height:2;font-size:1.1rem;color:#555}
  .poem p{margin:12px 0}
  .seal{display:inline-block;margin-top:30px;padding:8px 20px;border:2px solid #8b3a3a;color:#8b3a3a;font-size:1.1rem;border-radius:4px;letter-spacing:4px;background:rgba(255,255,255,0.9)}
  footer{text-align:center;margin-top:40px;font-size:0.9rem;color:#999}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>简约 · 中国风</h1>
    <div class="subtitle">—— 墨韵 · 纸上丹青</div>
  </header>
  
  <main class="content">
    <div class="poem">
      <p>山不在高，有仙则名。</p>
      <p>水不在深，有龙则灵。</p>
      <p>斯是陋室，惟吾德馨。</p>
    </div>
    
    <div style="text-align:center">
      <span class="seal">简约 · 中国风</span>
    </div>
  </main>
  
  <footer>
    <p>© 2026 · 简约设计</p>
  </footer>
</div>
</body>
</html>
